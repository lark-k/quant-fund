name: quant-fund

services:
  mysql:
    image: mysql:8.4
    container_name: quantfund-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: quantfund_root_password
      MYSQL_DATABASE: quant_fund
      MYSQL_USER: quantfund_app
      MYSQL_PASSWORD: quantfund_app_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"
    volumes:
      - quantfund-mysql-data:/var/lib/mysql
      - ./docs/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: quantfund-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - quantfund-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  quantfund-mysql-data:
  quantfund-redis-data:
