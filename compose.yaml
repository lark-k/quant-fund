name: quant-fund

services:
  quant-engine:
    build:
      context: ./quant-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      QUANT_ENGINE_HOST: 0.0.0.0
      QUANT_ENGINE_PORT: 8091
    ports:
      - "127.0.0.1:${QUANT_ENGINE_PORT:-8091}:8091"
    volumes:
      - quant-engine-cache:/app/.cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/v1/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  quant-fund-server:
    build:
      context: ./quant-fund-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./quant-fund-server/.env
    environment:
      TZ: Asia/Shanghai
      QUANTFUND_DB_URL: jdbc:mysql://host.docker.internal:${WINDOWS_MYSQL_PORT:-3306}/${WINDOWS_MYSQL_DATABASE:-quant_fund}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      QUANTFUND_REDIS_HOST: host.docker.internal
      QUANTFUND_REDIS_PORT: ${WINDOWS_REDIS_PORT:-6379}
      QUANT_ENGINE_BASE_URL: http://quant-engine:8091
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      quant-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  quant-fund-web:
    build:
      context: ./quant-fund-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      quant-fund-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  quant-engine-cache:
