server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: QuantFund
  config:
    import: optional:file:.env[.properties],optional:file:quant-fund-server/.env[.properties],optional:file:../quant-fund-server/.env[.properties]
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

quantfund:
  screener-strategy:
    strong-min-score: ${QUANTFUND_SCREENER_STRONG_MIN_SCORE:82}
    strong-top-percent: ${QUANTFUND_SCREENER_STRONG_TOP_PERCENT:8}
    watch-min-score: ${QUANTFUND_SCREENER_WATCH_MIN_SCORE:72}
    watch-top-percent: ${QUANTFUND_SCREENER_WATCH_TOP_PERCENT:20}
    neutral-min-score: ${QUANTFUND_SCREENER_NEUTRAL_MIN_SCORE:58}
    min-validation-samples: ${QUANTFUND_SCREENER_MIN_VALIDATION_SAMPLES:30}
    min-validation-score-dates: ${QUANTFUND_SCREENER_MIN_VALIDATION_SCORE_DATES:3}
  ai:
    enabled: ${DEEPSEEK_ENABLED:true}
    mock-enabled: ${DEEPSEEK_MOCK_ENABLED:false}
    provider: deepseek
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    timeout-ms: ${DEEPSEEK_TIMEOUT_MS:15000}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:1200}
    reasoning-enabled: ${DEEPSEEK_REASONING_ENABLED:false}
    account-analysis-concurrency: ${DEEPSEEK_ACCOUNT_ANALYSIS_CONCURRENCY:5}
  fund-data-source:
    timeout-ms: 5000
    refresh-interval-seconds: 120
    manual-refresh-cooldown-seconds: 10
    mock-fallback-enabled: ${QUANTFUND_FUND_MOCK_FALLBACK_ENABLED:false}
    east-money-enabled: true
    east-money-search-url: https://fundsuggest.eastmoney.com/FundSearch/api/FundSearchAPI.ashx
    east-money-estimate-url: https://fundcomapi.tiantianfunds.com/mm/newCore/FundValuationLast
    east-money-historical-nav-url: https://api.fund.eastmoney.com/f10/lsjz
    east-money-fund-detail-url: https://fund.eastmoney.com/pingzhongdata/{fundCode}.js
    east-money-fund-archive-url: https://fundf10.eastmoney.com/FundArchivesDatas.aspx
    east-money-quote-url: https://push2.eastmoney.com/api/qt/ulist.np/get
  quant-engine:
    enabled: ${QUANT_ENGINE_ENABLED:true}
    base-url: ${QUANT_ENGINE_BASE_URL:http://127.0.0.1:8091}
    timeout-ms: ${QUANT_ENGINE_TIMEOUT_MS:8000}
    batch-timeout-ms: ${QUANT_ENGINE_BATCH_TIMEOUT_MS:60000}
    backtest-timeout-ms: ${QUANT_ENGINE_BACKTEST_TIMEOUT_MS:300000}
    response-max-in-memory-mb: ${QUANT_ENGINE_RESPONSE_MAX_IN_MEMORY_MB:16}
    model-version: ${QUANT_ENGINE_MODEL_VERSION:rule-v1.39.0}
    fallback-to-java-rules: ${QUANT_ENGINE_FALLBACK_TO_JAVA_RULES:false}
    decision-deadline: ${QUANT_ENGINE_DECISION_DEADLINE:15:00:00}
    max-batch-holdings: ${QUANT_ENGINE_MAX_BATCH_HOLDINGS:100}
    max-backtest-funds: ${QUANT_ENGINE_MAX_BACKTEST_FUNDS:1000}
    max-param-grid: ${QUANT_ENGINE_MAX_PARAM_GRID:100}
    buy-threshold: ${QUANT_ENGINE_BUY_THRESHOLD:52}
    sell-threshold: ${QUANT_ENGINE_SELL_THRESHOLD:6}
    max-single-position-rate: ${QUANT_ENGINE_MAX_SINGLE_POSITION_RATE:45}
    buy-step-ratio: ${QUANT_ENGINE_BUY_STEP_RATIO:20}
    sell-step-ratio: ${QUANT_ENGINE_SELL_STEP_RATIO:8}
    take-profit-rate: ${QUANT_ENGINE_TAKE_PROFIT_RATE:300}
    stop-loss-rate: ${QUANT_ENGINE_STOP_LOSS_RATE:-18}
    min-nav-samples: ${QUANT_ENGINE_MIN_NAV_SAMPLES:40}
    warmup-days: ${QUANT_ENGINE_WARMUP_DAYS:180}
    trend-hold-return20d: ${QUANT_ENGINE_TREND_HOLD_RETURN20D:1.5}
    trend-hold-ma20-deviation: ${QUANT_ENGINE_TREND_HOLD_MA20_DEVIATION:-7}
  scheduler:
    enabled: ${QUANTFUND_SCHEDULER_ENABLED:true}
    screener-enabled: ${QUANTFUND_SCHEDULER_SCREENER_ENABLED:true}
    holidays: ${QUANTFUND_TRADING_HOLIDAYS:2026-01-01,2026-02-16,2026-02-17,2026-02-18,2026-02-19,2026-02-20,2026-04-06,2026-05-01,2026-05-04,2026-05-05,2026-06-19,2026-09-25,2026-10-01,2026-10-02,2026-10-05,2026-10-06,2026-10-07}
    hong-kong-holidays: ${QUANTFUND_HK_TRADING_HOLIDAYS:2026-01-01,2026-02-17,2026-02-18,2026-04-03,2026-04-06,2026-04-07,2026-05-01,2026-06-19,2026-07-01,2026-09-26,2026-10-01,2026-10-02,2026-10-19,2026-12-25,2026-12-26}
    us-holidays: ${QUANTFUND_US_TRADING_HOLIDAYS:2026-01-01,2026-01-19,2026-02-16,2026-04-03,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-11-26,2026-12-25}
    batch-delay-max-millis: ${QUANTFUND_SCHEDULER_BATCH_DELAY_MAX_MILLIS:800}
    ai-focus-holding-limit: ${QUANTFUND_SCHEDULER_AI_FOCUS_HOLDING_LIMIT:200}
    snapshot-backfill-trading-days: ${QUANTFUND_SNAPSHOT_BACKFILL_TRADING_DAYS:30}
